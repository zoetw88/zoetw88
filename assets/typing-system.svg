<svg xmlns="http://www.w3.org/2000/svg" width="220" height="112" viewBox="0 0 220 112" role="img" aria-labelledby="title desc">
  <title id="title">A tiny engineer typing at a laptop</title>
  <desc id="desc">Animated blue line illustration of a seated person typing while a progress signal moves across the laptop screen.</desc>
  <style>
    :root {
      --accent: #58a6ff;
      --ink: #c9d1d9;
      --muted: #8b949e;
      --panel: #161b22;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --accent: #0969da;
        --ink: #24292f;
        --muted: #57606a;
        --panel: #f6f8fa;
      }
    }

    .left-hand {
      animation: type-left 0.55s ease-in-out infinite alternate;
      transform-origin: 70px 50px;
    }

    .right-hand {
      animation: type-right 0.55s ease-in-out infinite alternate-reverse;
      transform-origin: 68px 52px;
    }

    .cursor {
      animation: blink 1s steps(2, jump-none) infinite;
    }

    .signal {
      animation: travel 2.8s ease-in-out infinite;
    }

    @keyframes type-left {
      to { transform: rotate(4deg); }
    }

    @keyframes type-right {
      to { transform: rotate(-4deg); }
    }

    @keyframes blink {
      50% { opacity: 0.15; }
    }

    @keyframes travel {
      0%, 15% { transform: translateX(0); opacity: 0; }
      30% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateX(58px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .left-hand, .right-hand, .cursor, .signal { animation: none; }
    }
  </style>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path stroke="var(--muted)" d="M41 59v29m0-12h22m-22 12l-8 15m8-15l9 15"/>

    <circle cx="58" cy="27" r="11" fill="var(--panel)" stroke="var(--accent)"/>
    <path stroke="var(--ink)" d="M49 27c4-11 15-12 20-3M55 39l-5 19l17 10l14-8M50 58l-8 19h22l10 24m-10-24l20 22"/>
    <path stroke="var(--accent)" d="M53 40c5 2 10 2 14-1"/>

    <g class="left-hand" stroke="var(--ink)">
      <path d="M65 47l22 12l25 2"/>
      <circle cx="112" cy="61" r="2" fill="var(--accent)" stroke="none"/>
    </g>
    <g class="right-hand" stroke="var(--ink)">
      <path d="M64 52l18 15l31-2"/>
      <circle cx="113" cy="65" r="2" fill="var(--accent)" stroke="none"/>
    </g>

    <path stroke="var(--muted)" d="M91 73h106M185 73v30M102 73v30"/>
    <path fill="var(--panel)" stroke="var(--accent)" d="M111 38h65a4 4 0 0 1 4 4v31h-73V42a4 4 0 0 1 4-4z"/>
    <path stroke="var(--muted)" d="M102 73h84l7 6h-98z"/>

    <path stroke="var(--muted)" d="M124 52h37"/>
    <circle cx="125" cy="52" r="2.5" fill="var(--accent)" stroke="none"/>
    <circle class="signal" cx="125" cy="52" r="2.5" fill="var(--accent)" stroke="none"/>
    <path class="cursor" stroke="var(--accent)" d="M124 61h18"/>

    <path stroke="var(--accent)" d="M190 60h9v13h-9m9-10h4a4 4 0 0 1 0 7h-4"/>
  </g>
</svg>
