<svg xmlns="http://www.w3.org/2000/svg" width="260" height="128" viewBox="0 0 260 128" role="img" aria-labelledby="title desc">
  <title id="title">Zoe building a feedback loop at her laptop</title>
  <desc id="desc">A compact animated illustration cycling through thinking, typing, and verified evidence.</desc>
  <style>
    :root {
      --accent: #58a6ff;
      --hoodie: #1f6feb;
      --ink: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --panel: #161b22;
      --skin: #f0c7a5;
      --hair: #111827;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --accent: #0969da;
        --hoodie: #0969da;
        --ink: #24292f;
        --muted: #57606a;
        --line: #d0d7de;
        --panel: #f6f8fa;
        --hair: #24292f;
      }
    }

    .character { animation: breathe 3s ease-in-out infinite; transform-origin: 76px 78px; }
    .eyes { animation: blink 4.4s ease-in-out infinite; transform-origin: 76px 40px; }
    .pose-focus { animation: focus-state 7s linear infinite; }
    .pose-type { animation: type-state 7s linear infinite; }
    .pose-evidence { animation: evidence-state 7s linear infinite; }
    .type-left { animation: key-left .42s ease-in-out infinite alternate; transform-origin: 62px 68px; }
    .type-right { animation: key-right .42s ease-in-out infinite alternate-reverse; transform-origin: 66px 69px; }
    .screen-code { animation: code-state 7s linear infinite; }
    .screen-check { animation: check-state 7s linear infinite; }
    .signal { animation: signal-run 1.55s ease-in-out infinite; }
    .spark { animation: sparkle 1.1s ease-in-out infinite alternate; transform-origin: center; }

    @keyframes breathe {
      50% { transform: translateY(1.5px); }
    }

    @keyframes blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(.12); }
    }

    @keyframes focus-state {
      0%, 16% { opacity: 1; }
      19%, 100% { opacity: 0; }
    }

    @keyframes type-state {
      0%, 16%, 78%, 100% { opacity: 0; }
      21%, 74% { opacity: 1; }
    }

    @keyframes evidence-state {
      0%, 76% { opacity: 0; }
      81%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes code-state {
      0%, 76% { opacity: 1; }
      81%, 96% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes check-state {
      0%, 76% { opacity: 0; transform: scale(.75); }
      83%, 96% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.75); }
    }

    @keyframes key-left {
      to { transform: rotate(3deg) translateY(1px); }
    }

    @keyframes key-right {
      to { transform: rotate(-3deg) translateY(1px); }
    }

    @keyframes signal-run {
      0% { transform: translateX(0); opacity: 0; }
      20%, 75% { opacity: 1; }
      100% { transform: translateX(42px); opacity: 0; }
    }

    @keyframes sparkle {
      to { opacity: .35; transform: scale(.75); }
    }

    @media (prefers-reduced-motion: reduce) {
      .character, .eyes, .type-left, .type-right, .signal, .spark { animation: none; }
      .pose-focus, .pose-evidence, .screen-check { animation: none; opacity: 0; }
      .pose-type, .screen-code { animation: none; opacity: 1; }
    }
  </style>

  <path d="M18 108h228" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
  <path d="M29 66v43m0-18h21m-21 18l-8 16m8-16l8 16" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="character">
    <path d="M43 67c2-18 15-29 33-29s32 12 34 31l3 31H40z" fill="var(--hoodie)"/>
    <path d="M50 62c8 7 17 10 27 10s20-4 28-11" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="75" cy="34" r="23" fill="var(--skin)"/>
    <path d="M52 36c0-20 11-30 27-30c15 0 25 10 25 25c-8-6-17-9-29-8c-8 0-15 3-23 8z" fill="var(--hair)"/>
    <path d="M56 27c5-3 10-4 15-3m10 0c5-1 10 0 14 3" fill="none" stroke="var(--hair)" stroke-width="2.5" stroke-linecap="round"/>
    <g class="eyes" fill="var(--hair)">
      <circle cx="67" cy="38" r="2.2"/>
      <circle cx="84" cy="38" r="2.2"/>
    </g>
    <path d="M70 49c4 3 8 3 12 0" fill="none" stroke="#9a5b46" stroke-width="2" stroke-linecap="round"/>

    <g class="pose-focus">
      <path d="M55 67c14 9 20 20 24 32" fill="none" stroke="var(--skin)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="80" cy="99" r="6" fill="var(--skin)"/>
      <path d="M93 67c2-12 1-20-4-27" fill="none" stroke="var(--skin)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="88" cy="39" r="6" fill="var(--skin)"/>
    </g>

    <g class="pose-type">
      <g class="type-left">
        <path d="M53 68c13 12 27 20 44 24" fill="none" stroke="var(--skin)" stroke-width="11" stroke-linecap="round"/>
        <circle cx="98" cy="92" r="6" fill="var(--skin)"/>
      </g>
      <g class="type-right">
        <path d="M94 68c11 10 21 17 35 21" fill="none" stroke="var(--skin)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="130" cy="89" r="6" fill="var(--skin)"/>
      </g>
    </g>

    <g class="pose-evidence">
      <path d="M54 68c14 11 28 19 44 23" fill="none" stroke="var(--skin)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="99" cy="91" r="6" fill="var(--skin)"/>
      <path d="M94 66c12-7 19-17 23-31" fill="none" stroke="var(--skin)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="118" cy="32" r="6" fill="var(--skin)"/>
      <path d="M118 31V18m0 1l7 6" fill="none" stroke="var(--skin)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="spark" d="M128 15v-7m-4 3l-5-5m13 5l5-5" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="124" y="29" width="91" height="68" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="4"/>
  <g class="screen-code">
    <circle cx="140" cy="49" r="4" fill="var(--accent)"/>
    <path d="M151 49h43" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="140" cy="66" r="4" fill="var(--accent)"/>
    <path d="M151 66h31" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M139 82h55" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
    <circle class="signal" cx="140" cy="82" r="3" fill="var(--accent)"/>
  </g>
  <g class="screen-check" transform-origin="169px 63px">
    <circle cx="169" cy="63" r="23" fill="none" stroke="var(--accent)" stroke-width="3" opacity=".35"/>
    <path d="M154 63l10 10l21-25" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M115 97h110l-10 11h-91z" fill="var(--line)" stroke="var(--muted)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M123 108v18m93-18v18" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
  <rect x="224" y="101" width="19" height="21" rx="4" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M243 106h4a6 6 0 0 1 0 11h-4" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
</svg>
