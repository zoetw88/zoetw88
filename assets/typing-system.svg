<svg xmlns="http://www.w3.org/2000/svg" width="240" height="112" viewBox="0 0 240 112" role="img" aria-labelledby="title desc">
  <title id="title">A tiny engineer building at a laptop</title>
  <desc id="desc">A refined animated stick figure types while the laptop moves from work in progress to verified evidence.</desc>
  <style>
    :root {
      --accent: #58a6ff;
      --ink: #c9d1d9;
      --muted: #8b949e;
      --line: #30363d;
      --panel: #161b22;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --accent: #0969da;
        --ink: #24292f;
        --muted: #57606a;
        --line: #d0d7de;
        --panel: #f6f8fa;
      }
    }

    .hand-back { animation: key-back .52s cubic-bezier(.22,.8,.32,1) infinite alternate; }
    .hand-front { animation: key-front .52s cubic-bezier(.22,.8,.32,1) infinite alternate-reverse; }
    .cursor { animation: cursor-blink 1.1s steps(2, jump-none) infinite; }
    .signal { animation: signal-travel 2.8s cubic-bezier(.22,.8,.32,1) infinite; }
    .screen-work { animation: work-state 6.4s linear infinite; }
    .screen-done { animation: done-state 6.4s linear infinite; transform-origin: 157px 56px; }
    .steam { animation: steam-rise 2.6s cubic-bezier(.22,.8,.32,1) infinite; }

    @keyframes key-back { to { transform: translateY(1.2px); } }
    @keyframes key-front { to { transform: translateY(-1.2px); } }
    @keyframes cursor-blink { 50% { opacity: .18; } }
    @keyframes signal-travel {
      0%, 12% { transform: translateX(0); opacity: 0; }
      28%, 74% { opacity: 1; }
      100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes work-state {
      0%, 70%, 100% { opacity: 1; }
      76%, 92% { opacity: 0; }
    }
    @keyframes done-state {
      0%, 70%, 100% { opacity: 0; transform: scale(.82); }
      78%, 92% { opacity: 1; transform: scale(1); }
    }
    @keyframes steam-rise {
      0% { opacity: 0; transform: translateY(2px); }
      35%, 68% { opacity: .7; }
      100% { opacity: 0; transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hand-back, .hand-front, .cursor, .signal, .screen-work, .screen-done, .steam { animation: none; }
      .screen-work { opacity: 1; }
      .screen-done { opacity: 0; }
    }
  </style>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
    <path stroke="var(--line)" d="M20 104h211"/>

    <path stroke="var(--muted)" d="M35 58v31m0-13h25M35 89l-9 17m9-17l10 17"/>

    <circle cx="62" cy="25" r="12" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.6"/>
    <path stroke="var(--ink)" d="M53 25c3-9 13-12 20-4M59 38l-6 20l18 12l17-9M53 58L36 80h28l11 27M64 80l19 24"/>
    <path stroke="var(--accent)" stroke-width="2.6" d="M56 39c5 2 10 2 14-1"/>

    <g class="hand-back" stroke="var(--ink)">
      <path d="M68 47l20 12l27 2"/>
      <circle cx="115" cy="61" r="2.2" fill="var(--accent)" stroke="none"/>
    </g>
    <g class="hand-front" stroke="var(--ink)">
      <path d="M66 52l18 15l32-3"/>
      <circle cx="116" cy="64" r="2.2" fill="var(--accent)" stroke="none"/>
    </g>

    <path stroke="var(--muted)" d="M92 75h125M105 82v24m99-24v24"/>
    <path fill="var(--panel)" stroke="var(--accent)" stroke-width="2.6" d="M113 36h70a5 5 0 0 1 5 5v34h-80V41a5 5 0 0 1 5-5z"/>
    <path fill="var(--panel)" stroke="var(--muted)" d="M101 75h95l8 7H93z"/>

    <g class="screen-work">
      <path stroke="var(--muted)" d="M127 50h43"/>
      <circle cx="128" cy="50" r="2.6" fill="var(--accent)" stroke="none"/>
      <circle class="signal" cx="128" cy="50" r="2.6" fill="var(--accent)" stroke="none"/>
      <path class="cursor" stroke="var(--accent)" stroke-width="2.6" d="M127 61h21"/>
    </g>
    <g class="screen-done" stroke="var(--accent)" stroke-width="3">
      <circle cx="156" cy="56" r="12" opacity=".35"/>
      <path d="M149 56l5 5l10-12"/>
    </g>

    <path stroke="var(--accent)" stroke-width="2.6" d="M207 59h10v16h-10m10-12h4a4.5 4.5 0 0 1 0 9h-4"/>
    <path class="steam" stroke="var(--muted)" d="M211 53c-3-3 3-5 0-8"/>
  </g>
</svg>
